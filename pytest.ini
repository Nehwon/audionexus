[pytest]
# Dossier contenant les tests
testpaths = tests

# Fichiers de test à inclure
python_files = test_*.py

# Fonctions de test à inclure
python_functions = test_*

# Options de rapport
addopts = -v

# Ignorer les dossiers de l'environnement virtuel et de cache
norecursedirs = .git .tox .eggs venv ENV env build dist

# Configuration de couverture de code simple
[tool:pytest]
addopts = --cov=app --cov-report=term-missing

[coverage:run]
source = app
omit = 
    */__init__.py
    */tests/*
    */migrations/*
    */wsgi.py

[coverage:report]
fail_under = 80
show_missing = true
skip_covered = true
