[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audionexus"
version = "0.3.6"  # Updated for authentication fixes and Pydantic v2 migration
description = "Plateforme de gestion centralisée d'instances Audiobookshelf avec interface web unifiée"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Fabrice Lamachère", email = "fabrice@lamachere.fr"}
]
maintainers = [
    {name = "Fabrice Lamachère", email = "fabrice@lamachere.fr"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # Core
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.21.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiomysql>=0.2.0",  # Connexion asynchrone MySQL pour SQLAlchemy
    "pymysql>=1.1.0",  # Connexion synchrone MySQL (pour Alembic)
    "aiosqlite>=0.19.0",  # Connexion asynchrone SQLite pour tests/développement
    # "psycopg2-binary>=2.9.5",  # Ancienne dépendance PostgreSQL (conservée pour référence)
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-magic>=0.4.27",
    
    # API & HTTP
    "httpx>=0.24.0",
    "pydantic>=1.10.7",
    "aiohttp>=3.8.4",
    "python-socketio>=5.8.0",
    
    # Audio Processing
    "mutagen>=1.46.0",
    "pydub>=0.25.1",
    "PyJWT>=2.8.0",
    
    # Testing
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "pytest-httpx>=0.23.3",
    "factory-boy>=3.2.1",
    "faker>=18.13.0",
    "responses>=0.23.1",
    
    # Utilities
    "aiofiles>=23.1.0",
    "python-slugify>=7.0.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.65.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0"
]

dev = [
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "flake8>=6.0.0",
    "nest_asyncio>=1.5.6"
]

[project.urls]
"Homepage" = "https://gitea.lamachere.fr/fabrice/docker/src/branch/AudioNexus"
"Bug Tracker" = "https://gitea.lamachere.fr/fabrice/docker/issues"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[flake8]
max-line-length = 88
extend-ignore = "E203"
max-complexity = 18
select = "B,C,E,F,W,T4,B9"
per-file-ignores = "__init__.py: F401"
