services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: audionexus-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_APP=wsgi:app
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    # Volumes commentés pour forcer l'utilisation du mode production
    # volumes:
    #   - .:/app
    #   - ./data/audionexus:/app/data/audionexus
    #   - ./data/config:/app/config
    #   - ./gunicorn.conf.py:/app/gunicorn.conf.py
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - audionexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: audionexus-db
    platform: linux/amd64  # Spécifier l'architecture si nécessaire
    restart: unless-stopped
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - audionexus-network

  redis:
    image: redis:7-alpine
    container_name: audionexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - audionexus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: audionexus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - audionexus-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: audionexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod-lb.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - audiobookshelf
    networks:
      - audionexus-network

  certbot:
    image: certbot/certbot
    container_name: audionexus-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME} --dry-run

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audionexus-audiobookshelf
    restart: unless-stopped
    environment:
      - AUDIOBOOKSHELF_UID=99
      - AUDIOBOOKSHELF_GID=100
      - TZ=Europe/Paris
      - AUDIOBOOKSHELF_BASE_URL=/audiobookshelf
    volumes:
      - ./data/audiobookshelf/config:/config
      - ./data/audiobookshelf/metadata:/metadata
      - ./data/audiobookshelf/podcasts:/podcasts
      - ./data/audiobookshelf/audiobooks:/audiobooks
    ports:
      - "13378:80"
    networks:
      - audionexus-network

networks:
  audionexus-network:
    driver: bridge

volumes:
  mysql_data:
    name: audionexus_mysql_data
  redis_data:
    name: audionexus_redis_data
