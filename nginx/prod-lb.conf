# Configuration Nginx avec Load Balancing pour AudioNexus
# Déploiement zero-downtime et haute disponibilité

user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging optimisé
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Optimisations de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstreams pour load balancing
    upstream audionexus_backend_primary {
        zone audionexus_backend_primary 64k;
        least_conn;

        server backend:8000 weight=5 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream audionexus_backend_replicas {
        zone audionexus_backend_replicas 64k;
        least_conn;

        server backend-replica-1:8000 weight=3 max_fails=2 fail_timeout=20s;
        server backend-replica-2:8000 weight=3 max_fails=2 fail_timeout=20s;
        keepalive 32;
    }

    upstream audionexus_backend_all {
        zone audionexus_backend_all 64k;
        least_conn;

        # Backend principal (écriture/lecture)
        server backend:8000 weight=5 max_fails=3 fail_timeout=30s;

        # Réplicas (lecture seule)
        server backend-replica-1:8000 weight=3 max_fails=2 fail_timeout=20s;
        server backend-replica-2:8000 weight=3 max_fails=2 fail_timeout=20s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        index index.html;

        # Health checks
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics pour Prometheus
        location /metrics {
            allow 127.0.0.1;
            deny all;

            stub_status on;
            access_log off;
        }

        # API AudioNexus avec load balancing intelligent
        location /api/ {
            # Rate limiting pour l'API
            limit_req zone=api burst=20 nodelay;

            # Headers de sécurité
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy "strict-origin-when-cross-origin";

            # Load balancing basé sur le type de requête
            proxy_pass http://audionexus_backend_all;

            # Configuration proxy
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts optimisés
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffers
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Gestion d'erreurs
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Endpoints d'authentification (doivent aller sur le primaire)
        location ~ ^/api/(auth|users)/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://audionexus_backend_primary;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Métriques de l'application (endpoint /metrics protégé)
        location /app-metrics {
            allow 127.0.0.1;
            deny all;

            proxy_pass http://audionexus_backend_primary/metrics;
            proxy_set_header Host $host;
        }

        # Fichiers statiques avec cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options DENY;

            proxy_pass http://audionexus_backend_all;
            proxy_set_header Host $host;
        }

        # Logs d'accès
        location /logs {
            alias /var/log/nginx;
            autoindex on;
            allow 127.0.0.1;
            deny all;
        }

        # Page d'état pour les load balancers externes
        location /status {
            access_log off;
            return 200 "AudioNexus Load Balancer - OK\n";
            add_header Content-Type text/plain;
        }
    }

    # Server pour HTTPS (avec certificats)
    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # Configuration SSL optimisée
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Session caching pour les performances
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

        # Redirection vers HTTP pour l'instant (à adapter selon vos besoins)
        location / {
            return 301 http://$server_name$request_uri;
        }
    }
}