# Configuration HTTP pour le développement local
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;
    
    # Augmenter la taille maximale du corps de la requête (1000M par défaut)
    client_max_body_size 0;  # Désactive la limite de taille pour les téléversements
    
    # Buffer size for POST submissions
    client_body_buffer_size 128k;
    
    # Max time to receive client headers/body
    client_header_timeout 300s;
    client_body_timeout 300s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Désactiver l'accès aux fichiers cachés
    location ~ /(\.|~$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proxy settings
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
        
        # Augmenter les timeouts pour les téléversements volumineux
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        
        # Buffer size for POST submissions
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        
        # Disable buffering for large files
        proxy_max_temp_file_size 0;
    }

    # Static files
    location /static/ {
        alias /app/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Media files
    location /media/ {
        alias /data/audionexus/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
}
