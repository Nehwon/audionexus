name: Docker Build and Push

on:
  push:
    branches: [ "devel" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get version from VERSION file
        id: get_version
        run: |
          VERSION=$(grep -oP 'CURRENT_VERSION=\K.*' VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/audionexus-backend:devel
            ${{ secrets.DOCKER_HUB_USERNAME }}/audionexus-backend:${{ steps.get_version.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/audionexus-frontend:devel
            ${{ secrets.DOCKER_HUB_USERNAME }}/audionexus-frontend:${{ steps.get_version.outputs.version }}